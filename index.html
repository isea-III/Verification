<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MNNIT Certificate Verification Portal</title>

    <!-- Cache-Busting Script Loader -->
    <script>
        (function() {
            var version = new Date().getTime(); 
            
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'style.css?v=' + version;
            document.head.appendChild(link);
            
            var configScript = document.createElement('script');
            configScript.src = 'config.js?v=' + version;
            document.head.appendChild(configScript);
            
            configScript.onload = function() {
                var mainScript = document.createElement('script');
                mainScript.src = 'script.js?v=' + version;
                document.head.appendChild(mainScript);
            };
        })();
    </script>
</head>

<body>
    <!-- Header --> 
    <div class="header" id="header">
        <!-- Left Logo (MNNIT) -->
        <img class="logo" src="https://lh3.googleusercontent.com/d/1uLcGZj-m_R4fj0hGs8u-WDtsU4NRDNap" alt="MNNIT Logo">

        <!-- Dynamic Event Title -->
        <div class="title">
            <h1>Certificate Verification Portal</h1>
            <p id="eventTitle">ISEA Phase-III & MNNIT Allahabad</p>
            <p id="eventSubTitle">Select an event below to verify</p>
        </div>

        <!-- Dynamic Event Logo (Right Side) -->
        <img id="eventLogo" class="logo" src="" style="display:none" alt="Event Logo">
    </div>  

    <!-- Search Box -->
    <div class="search-box">
        <h2>Verify Your Certificate</h2> 

        <!-- Options are populated automatically by script.js -->
        <select id="eventSelect" onchange="handleEventSelection()">
            <option value="">Select Event / Program</option>
        </select>

        <input 
            type="text" 
            id="certNo" 
            placeholder="Enter Certificate Number" 
            disabled>

        <button onclick="verifyCertificate()">
            Verify
        </button>
    </div>

    <!-- Result Area -->
    <div id="result"></div>

    <!-- Footer -->
    <div class="footer">
        © 2026 Department of Computer Science & Engineering | MNNIT Allahabad
    </div>
</body>
</html>
